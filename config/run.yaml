# Stage 2 run config — the live coordinator truth.

goal_tokens: 6000000000  # 2x Chinchilla for ~146M params; the 3B budget was met at outer step 113
# One plain-English line under the goal bar. The target moves during a run; without this the
# bar just falls from 100% to half and every volunteer reads it as work lost.
goal_note: "past 3B (Chinchilla-optimal) on 8 Aug — 6B makes a better model"

repos:
  model: commonsense-ai/fineweb-150m          # DRAFT name — decide before genesis
  dataset: commonsense-ai/fineweb-150m-inbox
  github: commonsense-ai/coop

model:                # ~145M params with tied embeddings
  n_layer: 12
  n_head: 14
  n_embd: 896
  block_size: 1024
  vocab_size: 32768
  dropout: 0.0
  bias: true

data:
  hf_dataset: HuggingFaceFW/fineweb-edu
  hf_config: sample-10BT   # streaming .skip() reads rows: offsets must fit a small subset
  text_field: text
  tokenizer: tokenizer/fineweb-32k.json
  train_docs: 9622101      # sample-10BT has 9,672,101 rows; last 50k reserved for val.bin

inner:
  h_steps: 200
  h_min: 50
  h_max: 500
  batch_size: 4        # 4x1024 tokens/step: ~150M model + AdamW fits 16GB laptops in f32
  lr: 3.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.1
  grad_clip: 1.0
  quantize: int4       # ~75MB per submission instead of ~150MB at int8
  accumulate_rounds: true  # one refreshed PR per user per step: bounds tick downloads

outer:
  lr: 0.7
  momentum: 0.9
  method: trimmed_mean
  trim_frac: 0.2
  min_cos: 0.0
  max_norm: 10.0
  max_val_regression: 0.3  # tighter breaker: stage-2 steps move val loss less than stage 1's
  probation_weight: 0.25   # unproven identities vote at quarter influence until first accept
  credit: sum_distinct     # pay every genuinely-different round, capped at plausible size

staleness:
  tau_max: 8

eval:
  val_file: val.bin
  batches: 8
  batch_size: 2
  sample_prompt: "The most important thing to understand about"
  sample_tokens: 120
