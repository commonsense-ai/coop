# DRAFT — stage 2 run config. Not live. STAGE2.md is the launch runbook;
# launch day this file replaces config/run.yaml (the single source of run config).

repos:
  model: commonsense-ai/fineweb-150m          # DRAFT name — decide before genesis
  dataset: commonsense-ai/fineweb-150m-inbox
  github: commonsense-ai/coop

model:                # ~145M params with tied embeddings
  n_layer: 12
  n_head: 14
  n_embd: 896
  block_size: 1024
  vocab_size: 32768
  dropout: 0.0
  bias: true

data:
  hf_dataset: HuggingFaceFW/fineweb-edu
  text_field: text
  tokenizer: tokenizer/fineweb-32k.json  # train via runbook step 2
  train_docs: 0                          # set from the chosen subset's row count (runbook step 3)

inner:
  h_steps: 200
  h_min: 50
  h_max: 500
  batch_size: 4        # 4x1024 tokens/step: ~150M model + AdamW fits 16GB laptops in f32
  lr: 3.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.1
  grad_clip: 1.0
  quantize: int4       # ~75MB per submission instead of ~150MB at int8
  accumulate_rounds: true  # one refreshed PR per user per step: bounds tick downloads

outer:
  lr: 0.7
  momentum: 0.9
  method: trimmed_mean
  trim_frac: 0.2
  min_cos: 0.0
  max_norm: 10.0
  max_val_regression: 0.3  # tighter breaker: stage-2 steps move val loss less than stage 1's
  probation_weight: 0.25   # unproven identities vote at quarter influence until first accept

staleness:
  tau_max: 8

eval:
  val_file: val.bin
  batches: 8
  batch_size: 2
  sample_prompt: "The most important thing to understand about"
  sample_tokens: 120
