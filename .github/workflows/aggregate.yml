# One stateless outer step per tick. Cron delay/skips are fine: state lives in the
# HF repos, so a missed or crashed tick just means the next one does the work.
#
# Ledger state lives on the unprotected `ledger` branch: main only changes via
# approved PRs, and this org disables deploy keys, so the bot cannot bypass main's
# ruleset — it pushes ledger commits to `ledger` instead.
name: aggregate

on:
  schedule:
    # offset from :00/:15/:30/:45 — on-the-quarter-hour crons get the worst
    # queueing delay on GitHub's shared scheduler
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aggregate
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # well under the 6h kill; a tick should stay < 10 min
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ledger
          path: ledgerdata
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --no-dev
      - run: uv run --no-dev python -m coop.aggregate --repo-root ledgerdata
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
      - name: Commit ledger + leaderboard
        working-directory: ledgerdata
        run: |
          git config user.name "coop-aggregator"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ledger/ LEADERBOARD.md
          git diff --cached --quiet || { git commit -m "tick: update ledger + leaderboard"; git push; }
