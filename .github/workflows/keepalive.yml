# GitHub disables scheduled workflows after 60 days without repo activity.
# A weekly marker commit resets that clock. It lands on the unprotected
# `ledger` branch since main only changes via approved PRs.
name: keepalive

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ledger
      - run: |
          git config user.name "coop-aggregator"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date -u +%Y-%m-%dT%H:%M:%SZ > .keepalive
          git add .keepalive
          git commit -m "keepalive"
          git push
