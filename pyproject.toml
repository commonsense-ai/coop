[project]
name = "coop"
version = "0.1.0"
description = "Community-pretrained small language model via DiLoCo-style low-communication training"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "huggingface_hub>=0.26",
    "safetensors>=0.4",
    "numpy>=1.26",
    "tokenizers>=0.20",
    "datasets>=3.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coop"]

# CPU wheels: an aggregator tick must not spend minutes pulling CUDA builds.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
