[project]
name = "coop-ai"  # distribution name; the import package and CLI are both `coop`
version = "0.3.0"
description = "Community-pretrained small language model via DiLoCo-style low-communication training"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
keywords = ["distributed-training", "diloco", "community", "language-model"]
dependencies = [
    "torch>=2.4",
    "huggingface_hub>=0.26",
    "safetensors>=0.4",
    "numpy>=1.26",
    "tokenizers>=0.20",
    "datasets>=3.0",
    "pyyaml>=6.0",
]

# Opt-in CPU wheels for CI and the aggregator (see [tool.uv.sources] below).
[project.optional-dependencies]
cpu = ["torch>=2.4"]

[project.scripts]
coop = "coop.cli:main"
coop-join = "coop.join:main"

[project.urls]
Homepage = "https://github.com/commonsense-ai/coop"
Leaderboard = "https://github.com/commonsense-ai/coop/blob/ledger/LEADERBOARD.md"
Model = "https://huggingface.co/commonsense-ai/tinystories-15m"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coop"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# The pin MUST stay behind the `cpu` extra: uv applies a dependency's sources to
# `uvx`/`pip install git+...` too, so pinning torch here hands every volunteer a
# CPU-only wheel and silently strands NVIDIA donors on their CPU. `--extra cpu`
# keeps an aggregator tick from spending minutes pulling CUDA builds.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "cpu" }]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
